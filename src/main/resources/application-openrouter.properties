# Optional profile: send the Spring AI "OpenAI" client to OpenRouter instead of OpenAI.
# OpenRouter speaks the same API, so no code changes are needed.
#
# Activate with the environment variable SPRING_PROFILES_ACTIVE=openrouter and put
# your OpenRouter key (sk-or-v1-...) in OPENAI_API_KEY. Without this profile the app
# talks to OpenAI directly, exactly as the assignment describes.
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# "openrouter/free" automatically routes to whichever free model is available.
spring.ai.openai.chat.options.model=openrouter/free
